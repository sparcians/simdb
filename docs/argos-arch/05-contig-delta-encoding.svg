<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Contig Container Delta Encoding</text>
  <text x="600" y="66" text-anchor="middle" font-size="15" fill="#64748b">Fixed-capacity queue: bins stored in order; empty bin marks end of used slots</text>

  <!-- Data model -->
  <rect x="40" y="90" width="1120" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="118" font-size="15" font-weight="700" fill="#334155">Data model</text>
  <text x="60" y="142" font-size="13" fill="#475569">In memory: vector of bin payloads (index 0 = front). Type encoded as e.g. Inst_contig_capacity32.</text>
  <text x="60" y="162" font-size="13" fill="#475569">FULL wire payload: [count][bin0 bytes][bin1 bytes]...   Delta wires carry only what changed.</text>

  <!-- Action legend -->
  <rect x="40" y="200" width="1120" height="72" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="60" y="228" font-size="14" font-weight="700" fill="#312e81">Wire actions (after CID header)</text>
  <g font-size="12">
    <rect x="60" y="240" width="70" height="24" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="95" y="257" text-anchor="middle">FULL</text>
    <rect x="140" y="240" width="70" height="24" rx="5" fill="#dcfce7" stroke="#22c55e"/><text x="175" y="257" text-anchor="middle">CARRY</text>
    <rect x="220" y="240" width="70" height="24" rx="5" fill="#fef3c7" stroke="#f59e0b"/><text x="255" y="257" text-anchor="middle">SWAP</text>
    <rect x="300" y="240" width="80" height="24" rx="5" fill="#fef3c7" stroke="#f59e0b"/><text x="340" y="257" text-anchor="middle">ARRIVE</text>
    <rect x="390" y="240" width="80" height="24" rx="5" fill="#fef3c7" stroke="#f59e0b"/><text x="430" y="257" text-anchor="middle">DEPART</text>
    <rect x="480" y="240" width="95" height="24" rx="5" fill="#fef3c7" stroke="#f59e0b"/><text x="527" y="257" text-anchor="middle">BOOKENDS</text>
    <rect x="585" y="240" width="75" height="24" rx="5" fill="#fee2e2" stroke="#ef4444"/><text x="622" y="257" text-anchor="middle">CLOSED</text>
    <text x="680" y="257" font-size="12" fill="#64748b">classifyContigChange(prev, curr) picks the smallest wire</text>
  </g>

  <!-- Visual examples row 1 -->
  <text x="60" y="305" font-size="16" font-weight="700" fill="#334155">Pattern recognition (prev -> curr)</text>

  <!-- CARRY -->
  <rect x="40" y="320" width="360" height="130" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="60" y="345" font-size="14" font-weight="700" fill="#166534">CARRY - identical</text>
  <g font-size="13">
    <rect x="60" y="360" width="40" height="32" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="80" y="381" text-anchor="middle">A</text>
    <rect x="105" y="360" width="40" height="32" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="125" y="381" text-anchor="middle">B</text>
    <rect x="150" y="360" width="40" height="32" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="170" y="381" text-anchor="middle">C</text>
    <text x="210" y="381" fill="#64748b">same size, all bins match</text>
    <text x="60" y="420" font-size="12" fill="#475569">Wire: CARRY (no payload - viewer reuses last FULL)</text>
  </g>

  <!-- SWAP -->
  <rect x="420" y="320" width="360" height="130" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="345" font-size="14" font-weight="700" fill="#92400e">SWAP - one slot changed</text>
  <g font-size="13">
    <rect x="440" y="360" width="40" height="32" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="460" y="381" text-anchor="middle">A</text>
    <rect x="485" y="360" width="40" height="32" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="505" y="381" text-anchor="middle">X</text>
    <rect x="530" y="360" width="40" height="32" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="550" y="381" text-anchor="middle">C</text>
    <text x="590" y="375" fill="#64748b">prev: A B C</text>
    <text x="590" y="395" fill="#64748b">only index 1 changed</text>
    <text x="440" y="430" font-size="12" fill="#475569">Wire: SWAP [index=1][new bin bytes X]</text>
  </g>

  <!-- ARRIVE -->
  <rect x="800" y="320" width="360" height="130" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="820" y="345" font-size="14" font-weight="700" fill="#92400e">ARRIVE - push back (+1 size)</text>
  <g font-size="13">
    <rect x="820" y="360" width="40" height="32" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="840" y="381" text-anchor="middle">A</text>
    <rect x="865" y="360" width="40" height="32" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="885" y="381" text-anchor="middle">B</text>
    <rect x="910" y="360" width="40" height="32" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="930" y="381" text-anchor="middle">D</text>
    <text x="970" y="381" fill="#64748b">prefix unchanged</text>
    <text x="820" y="430" font-size="12" fill="#475569">Wire: ARRIVE [new tail bin bytes D]</text>
  </g>

  <!-- Row 2 -->
  <!-- DEPART -->
  <rect x="40" y="470" width="360" height="130" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="60" y="495" font-size="14" font-weight="700" fill="#92400e">DEPART - pop front (-1 size)</text>
  <g font-size="13">
    <rect x="60" y="510" width="40" height="32" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="80" y="531" text-anchor="middle">B</text>
    <rect x="105" y="510" width="40" height="32" rx="4" fill="#dbeafe" stroke="#60a5fa"/><text x="125" y="531" text-anchor="middle">C</text>
    <text x="165" y="525" fill="#64748b">prev: A B C</text>
    <text x="165" y="545" fill="#64748b">curr[i] == prev[i+1] for all i</text>
    <text x="60" y="580" font-size="12" fill="#475569">Wire: DEPART (no payload - viewer drops front bin)</text>
  </g>

  <!-- BOOKENDS -->
  <rect x="420" y="470" width="360" height="130" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="440" y="495" font-size="14" font-weight="700" fill="#92400e">BOOKENDS - shift + new tail</text>
  <g font-size="13">
    <text x="440" y="525" fill="#64748b">prev: A B C  (size 3)</text>
    <text x="440" y="545" fill="#64748b">curr: B C D  (same size, multi-change)</text>
    <text x="440" y="565" fill="#64748b">curr[i] == prev[i+1] for i=0..n-2</text>
    <text x="440" y="585" font-size="12" fill="#475569">Wire: BOOKENDS [new tail bin bytes D]</text>
  </g>

  <!-- FULL fallback -->
  <rect x="800" y="470" width="360" height="130" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="820" y="495" font-size="14" font-weight="700" fill="#991b1b">FULL - fallback</text>
  <g font-size="12" fill="#475569">
    <text x="820" y="520">Also used when:</text>
    <text x="820" y="540">- first checkpoint (no prev baseline)</text>
    <text x="820" y="558">- closed since last data checkpoint</text>
    <text x="820" y="576">- heartbeat forces snapshot</text>
    <text x="820" y="594">- change does not match any pattern above</text>
  </g>

  <!-- Decision flow -->
  <rect x="40" y="620" width="1120" height="175" rx="12" fill="#f0fdf4" stroke="#34d399" stroke-width="2"/>
  <text x="600" y="650" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">classifyContigChange decision order</text>
  <g font-size="12" fill="#475569">
    <text x="60" y="680">1. prev empty? -> FULL</text>
    <text x="60" y="700">2. same size + 0 diffs -> CARRY</text>
    <text x="60" y="720">3. same size + 1 diff -> SWAP</text>
    <text x="60" y="740">4. same size + shift pattern (bookends) -> BOOKENDS</text>
    <text x="60" y="760">5. size +1 + prefix match -> ARRIVE</text>

    <text x="420" y="680">6. size -1 + shift pattern -> DEPART</text>
    <text x="420" y="700">7. else -> FULL</text>
    <text x="420" y="730" font-weight="600" fill="#334155">ContigContainerCheckpointer uses same chain / heartbeat</text>
    <text x="420" y="750">logic as scalars; only the per-window encode step differs.</text>
  </g>
</svg>
