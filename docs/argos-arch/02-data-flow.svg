<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Data Flow: EntryPoint � Stager Interface � Checkpoint</text>
  <text x="600" y="72" text-anchor="middle" font-size="15" fill="#64748b">What happens when a collectable updates during one simulation time window</text>

  <!-- Step boxes -->
  <g font-size="14" fill="#0f172a">
    <!-- 1 -->
    <rect x="80" y="120" width="200" height="90" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="180" y="152" text-anchor="middle" font-weight="700">` EntryPoint</text>
    <text x="180" y="175" text-anchor="middle" font-size="12" fill="#475569">CID assigned at creation</text>
    <text x="180" y="195" text-anchor="middle" font-size="12" fill="#475569">set*ValueBytes(...)</text>

    <line x1="280" y1="165" x2="330" y2="165" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 2 -->
    <rect x="330" y="120" width="220" height="90" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="440" y="152" text-anchor="middle" font-weight="700">a PipelineStagerInterface</text>
    <text x="440" y="175" text-anchor="middle" font-size="12" fill="#475569">virtual stage(cid, bytes)</text>
    <text x="440" y="195" text-anchor="middle" font-size="12" fill="#475569">closeRecord / postNotif</text>

    <line x1="550" y1="165" x2="600" y2="165" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 3 -->
    <rect x="600" y="120" width="220" height="90" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="710" y="152" text-anchor="middle" font-weight="700">b ArgosCollector::stage</text>
    <text x="710" y="175" text-anchor="middle" font-size="12" fill="#475569">assertLive + checkTimeAdvanced</text>
    <text x="710" y="195" text-anchor="middle" font-size="12" fill="#475569">ledger_->record*(cid, ...)</text>

    <line x1="820" y1="165" x2="870" y2="165" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- 4 -->
    <rect x="870" y="120" width="250" height="90" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="995" y="152" text-anchor="middle" font-weight="700">c Ledger (same sim time)</text>
    <text x="995" y="175" text-anchor="middle" font-size="12" fill="#475569">window_id + sim_time fixed</text>
    <text x="995" y="195" text-anchor="middle" font-size="12" fill="#475569">buffers all CIDs this tick</text>
  </g>

  <!-- Vertical drop to pipeline -->
  <line x1="600" y1="210" x2="600" y2="280" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="620" y="250" font-size="12" fill="#64748b">time advances � LedgerPtr queued</text>

  <!-- PipelineStager processing -->
  <rect x="120" y="290" width="960" height="360" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="600" y="325" text-anchor="middle" font-size="20" font-weight="700" fill="#065f46">PipelineStager::run_ (async pipeline thread)</text>

  <!-- Inner flow -->
  <rect x="160" y="360" width="180" height="70" rx="10" fill="#ffffff" stroke="#10b981"/>
  <text x="250" y="392" text-anchor="middle" font-size="14" font-weight="600">Pop LedgerPtr</text>
  <text x="250" y="412" text-anchor="middle" font-size="11" fill="#64748b">window_id, sim_time</text>

  <line x1="340" y1="395" x2="390" y2="395" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="390" y="350" width="210" height="90" rx="10" fill="#ffffff" stroke="#10b981"/>
  <text x="495" y="382" text-anchor="middle" font-size="14" font-weight="600">createCheckpoint</text>
  <text x="495" y="402" text-anchor="middle" font-size="11" fill="#64748b">per scalar / contig / sparse entry</text>
  <text x="495" y="420" text-anchor="middle" font-size="11" fill="#64748b">closeRecord for closed CIDs</text>

  <line x1="600" y1="395" x2="650" y2="395" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="650" y="350" width="210" height="90" rx="10" fill="#ffffff" stroke="#10b981"/>
  <text x="755" y="382" text-anchor="middle" font-size="14" font-weight="600">encodeForPipeline</text>
  <text x="755" y="402" text-anchor="middle" font-size="11" fill="#64748b">each Checkpointer � wires</text>
  <text x="755" y="420" text-anchor="middle" font-size="11" fill="#64748b">FULL / CARRY / CLOSED / ...</text>

  <line x1="860" y1="395" x2="910" y2="395" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="910" y="360" width="130" height="70" rx="10" fill="#ffffff" stroke="#10b981"/>
  <text x="975" y="392" text-anchor="middle" font-size="14" font-weight="600">QueueCollectionData</text>
  <text x="975" y="412" text-anchor="middle" font-size="11" fill="#64748b">� compressor</text>

  <!-- Checkpointer detail -->
  <rect x="200" y="480" width="800" height="140" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="600" y="510" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Per-CID Checkpointer (Scalar / Contig / Sparse)</text>
  <text x="220" y="540" font-size="13" fill="#475569">" One checkpointer created at pipeline init for each collectable CID</text>
  <text x="220" y="565" font-size="13" fill="#475569">" createCheckpoint(window_id, raw_bytes) appends to a linked chain (head � tail)</text>
  <text x="220" y="590" font-size="13" fill="#475569">" encodeForPipeline(window_id, sim_time, cid) picks the anchor for this window and emits encoded CollectedData</text>

  <!-- Types legend -->
  <rect x="160" y="650" width="880" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="600" y="680" text-anchor="middle" font-size="12" fill="#475569">Wire format: [uint16 CID][uint8 Action][payload...]    Actions include FULL, CARRY, CLOSED, and container-specific deltas</text>
</svg>
