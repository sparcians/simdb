<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Checkpointer Logic</text>
  <text x="600" y="66" text-anchor="middle" font-size="15" fill="#64748b">Delta encoding chain per collectable  decides what gets wired to the DB each window</text>

  <!-- Checkpoint chain -->
  <rect x="40" y="90" width="520" height="280" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="300" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">Checkpoint chain (per CID)</text>
  <text x="300" y="142" text-anchor="middle" font-size="12" fill="#64748b">head_ = newest event  |  tail_ = oldest unsent anchor</text>

  <!-- Chain nodes -->
  <g font-size="11">
    <rect x="70" y="200" width="90" height="55" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="115" y="222" text-anchor="middle" font-weight="600">w=1 FULL</text>
    <text x="115" y="240" text-anchor="middle" fill="#64748b">bytes A</text>

    <line x1="160" y1="227" x2="185" y2="227" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <rect x="185" y="200" width="90" height="55" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="230" y="222" text-anchor="middle" font-weight="600">w=2 FULL</text>
    <text x="230" y="240" text-anchor="middle" fill="#64748b">bytes B</text>

    <line x1="275" y1="227" x2="300" y2="227" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <rect x="300" y="200" width="90" height="55" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="345" y="222" text-anchor="middle" font-weight="600">w=3 same</text>
    <text x="345" y="240" text-anchor="middle" fill="#64748b">bytes B</text>

    <line x1="390" y1="227" x2="415" y2="227" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <rect x="415" y="200" width="90" height="55" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="460" y="222" text-anchor="middle" font-weight="600">w=4 CLOSED</text>
    <text x="460" y="240" text-anchor="middle" fill="#64748b">lifecycle</text>
  </g>

  <text x="115" y="185" text-anchor="middle" font-size="11" fill="#64748b">tail_ �</text>
  <text x="460" y="185" text-anchor="middle" font-size="11" fill="#64748b">� head_</text>

  <text x="70" y="280" font-size="12" fill="#475569">createCheckpoint(window_id, bytes): prepend new data node at head_</text>
  <text x="70" y="300" font-size="12" fill="#475569">closeRecord(window_id, true): prepend CLOSED lifecycle node at head_</text>
  <text x="70" y="330" font-size="12" fill="#475569">After wiring: cleanupThrough_() moves tail_ forward; FULL detaches prior history</text>
  <text x="70" y="350" font-size="12" fill="#475569">wire_distance_: counts CARRY wires since last FULL (resets on FULL/CLOSED)</text>

  <!-- encodeForPipeline decision tree -->
  <rect x="580" y="90" width="580" height="280" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="870" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">encodeForPipeline(window_id, sim_time, cid)</text>

  <rect x="610" y="145" width="240" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="730" y="168" text-anchor="middle" font-size="12">Find anchor = checkpoint for this window_id</text>
  <text x="730" y="185" text-anchor="middle" font-size="11" fill="#64748b">(walk tail_ � head_)</text>

  <line x1="730" y1="195" x2="730" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="680,220 780,245 680,270" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="730" y="242" text-anchor="middle" font-size="11">anchor exists</text>
  <text x="730" y="256" text-anchor="middle" font-size="11">for window?</text>

  <!-- Yes branch -->
  <line x1="780" y1="245" x2="830" y2="245" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="805" y="235" font-size="10" fill="#16a34a">yes</text>
  <rect x="830" y="220" width="300" height="50" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="980" y="242" text-anchor="middle" font-size="12">anchor�encodeForPipeline(force_snapshot?)</text>
  <text x="980" y="258" text-anchor="middle" font-size="11" fill="#64748b">force if wire_distance+1 e heartbeat</text>

  <!-- No branch -->
  <line x1="730" y1="270" x2="730" y2="295" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="745" y="288" font-size="10" fill="#dc2626">no update this window</text>

  <polygon points="630,295 830,320 630,345" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="730" y="318" text-anchor="middle" font-size="11">shouldAbsentHeartbeatRefresh_?</text>
  <text x="730" y="334" text-anchor="middle" font-size="11">(heartbeat window crossed)</text>

  <line x1="830" y1="320" x2="880" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="855" y="310" font-size="10" fill="#16a34a">yes</text>
  <rect x="880" y="295" width="250" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1005" y="318" text-anchor="middle" font-size="12">Re-emit FULL from latest data</text>
  <text x="1005" y="334" text-anchor="middle" font-size="11" fill="#64748b">or CLOSED wires if tip is closed</text>

  <line x1="730" y1="345" x2="730" y2="360" stroke="#334155" stroke-width="2"/>
  <text x="745" y="358" font-size="10" fill="#64748b">else: emit nothing</text>

  <!-- Action encoding -->
  <rect x="40" y="400" width="1120" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="430" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">Scalar encoding decisions (containers add SWAP/ARRIVE/DEPART/...)</text>

  <g font-size="13">
    <rect x="70" y="455" width="150" height="60" rx="8" fill="#fee2e2" stroke="#ef4444"/>
    <text x="145" y="480" text-anchor="middle" font-weight="700">CLOSED</text>
    <text x="145" y="500" text-anchor="middle" font-size="11" fill="#64748b">lifecycle event</text>

    <rect x="250" y="455" width="150" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="325" y="480" text-anchor="middle" font-weight="700">FULL</text>
    <text x="325" y="500" text-anchor="middle" font-size="11" fill="#64748b">complete bytes</text>

    <rect x="430" y="455" width="150" height="60" rx="8" fill="#dcfce7" stroke="#22c55e"/>
    <text x="505" y="480" text-anchor="middle" font-weight="700">CARRY</text>
    <text x="505" y="500" text-anchor="middle" font-size="11" fill="#64748b">same as prev � no payload</text>
  </g>

  <text x="70" y="545" font-size="12" fill="#475569">FULL when: first checkpoint, bytes changed vs prev data checkpoint, closed since prev data, or force_snapshot (heartbeat)</text>
  <text x="70" y="565" font-size="12" fill="#475569">CARRY when: bytes identical to previous data checkpoint and no intervening CLOSED</text>
  <text x="70" y="585" font-size="12" fill="#475569">CLOSED event may emit two wires: optional FULL primer (if viewer needs baseline) + CLOSED marker</text>

  <!-- Example timeline -->
  <rect x="40" y="610" width="1120" height="180" rx="14" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2"/>
  <text x="600" y="640" text-anchor="middle" font-size="17" font-weight="700" fill="#0c4a6e">Example: scalar value 42 � 42 � 99 (heartbeat=10)</text>

  <g font-size="12">
    <text x="70" y="675" fill="#475569">w1: value=42</text>
    <text x="70" y="695" fill="#475569">� wire FULL(42)</text>

    <text x="280" y="675" fill="#475569">w2: value=42 (unchanged)</text>
    <text x="280" y="695" fill="#475569">� wire CARRY</text>

    <text x="520" y="675" fill="#475569">w3: value=99</text>
    <text x="520" y="695" fill="#475569">� wire FULL(99)</text>

    <text x="760" y="675" fill="#475569">w4w12: no updates</text>
    <text x="760" y="695" fill="#475569">� nothing until heartbeat</text>

    <text x="760" y="715" fill="#475569">� then FULL(99) refresh</text>

    <text x="980" y="675" fill="#475569">closeRecord()</text>
    <text x="980" y="695" fill="#475569">� FULL primer?</text>
    <text x="980" y="715" fill="#475569">+ CLOSED</text>
  </g>

  <text x="600" y="770" text-anchor="middle" font-size="12" fill="#64748b">Python viewer replays wires left-to-right per timestamp; CARRY reuses last FULL for that CID</text>
</svg>
