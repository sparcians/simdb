<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#f8fafc"/>
  <text x="600" y="38" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Sparse Container Delta Encoding</text>
  <text x="600" y="66" text-anchor="middle" font-size="15" fill="#64748b">Keyed bins (index -> payload): only occupied slots are stored; indices may be non-contiguous</text>

  <!-- Data model -->
  <rect x="40" y="90" width="1120" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="118" font-size="15" font-weight="700" fill="#334155">Data model</text>
  <text x="60" y="142" font-size="13" fill="#475569">In memory: map of bin_index -> bin bytes. Type encoded as e.g. Inst_sparse_capacity32.</text>
  <text x="60" y="162" font-size="13" fill="#475569">FULL wire payload: [count][idx0][bin0][idx1][bin1]...   Sparse deltas name the bin index explicitly.</text>

  <!-- Action legend -->
  <rect x="40" y="200" width="1120" height="72" rx="12" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="60" y="228" font-size="14" font-weight="700" fill="#581c87">Wire actions (after CID header)</text>
  <g font-size="12">
    <rect x="60" y="240" width="70" height="24" rx="5" fill="#dbeafe" stroke="#3b82f6"/><text x="95" y="257" text-anchor="middle">FULL</text>
    <rect x="140" y="240" width="70" height="24" rx="5" fill="#dcfce7" stroke="#22c55e"/><text x="175" y="257" text-anchor="middle">CARRY</text>
    <rect x="220" y="240" width="70" height="24" rx="5" fill="#fae8ff" stroke="#c026d3"/><text x="255" y="257" text-anchor="middle">SWAP</text>
    <rect x="300" y="240" width="85" height="24" rx="5" fill="#fae8ff" stroke="#c026d3"/><text x="342" y="257" text-anchor="middle">REMOVE</text>
    <rect x="395" y="240" width="75" height="24" rx="5" fill="#fee2e2" stroke="#ef4444"/><text x="432" y="257" text-anchor="middle">CLOSED</text>
    <text x="490" y="257" font-size="12" fill="#64748b">No ARRIVE/DEPART/BOOKENDS - sparse uses index-targeted updates only</text>
  </g>

  <!-- Visual: map representation helper -->
  <text x="60" y="305" font-size="16" font-weight="700" fill="#334155">Pattern recognition (prev map -> curr map)</text>

  <!-- CARRY -->
  <rect x="40" y="320" width="360" height="145" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
  <text x="60" y="345" font-size="14" font-weight="700" fill="#166534">CARRY - maps equal</text>
  <g font-size="12" fill="#475569">
    <text x="60" y="370">prev: {2:A, 5:B, 9:C}</text>
    <text x="60" y="390">curr: {2:A, 5:B, 9:C}</text>
    <text x="60" y="420">Exact map equality (all indices and bytes match)</text>
    <text x="60" y="450" font-weight="600">Wire: CARRY (no payload)</text>
  </g>

  <!-- SWAP -->
  <rect x="420" y="320" width="360" height="145" rx="10" fill="#ffffff" stroke="#c026d3" stroke-width="1.5"/>
  <text x="440" y="345" font-size="14" font-weight="700" fill="#86198f">SWAP - one bin updated</text>
  <g font-size="12" fill="#475569">
    <text x="440" y="370">prev: {2:A, 5:B, 9:C}</text>
    <text x="440" y="390">curr: {2:A, 5:X, 9:C}   (only index 5 changed)</text>
    <text x="440" y="420">Same set of indices; exactly one payload differs</text>
    <text x="440" y="450" font-weight="600">Wire: SWAP [bin_index=5][new bytes X]</text>
  </g>

  <!-- REMOVE -->
  <rect x="800" y="320" width="360" height="145" rx="10" fill="#ffffff" stroke="#c026d3" stroke-width="1.5"/>
  <text x="820" y="345" font-size="14" font-weight="700" fill="#86198f">REMOVE - one bin cleared</text>
  <g font-size="12" fill="#475569">
    <text x="820" y="370">prev: {2:A, 5:B, 9:C}</text>
    <text x="820" y="390">curr: {2:A, 9:C}   (index 5 gone)</text>
    <text x="820" y="420">No other index added/changed; count drops by 1</text>
    <text x="820" y="450" font-weight="600">Wire: REMOVE [bin_index=5] (no payload)</text>
  </g>

  <!-- FULL cases -->
  <rect x="40" y="485" width="560" height="155" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="60" y="510" font-size="14" font-weight="700" fill="#991b1b">FULL - fallback (re-send entire map)</text>
  <g font-size="12" fill="#475569">
    <text x="60" y="535">- first checkpoint (prev empty)</text>
    <text x="60" y="555">- closed since last data checkpoint / heartbeat refresh</text>
    <text x="60" y="575">- element count changed AND not a pure REMOVE pattern</text>
    <text x="60" y="595">- more than one bin changed or removed in same window</text>
    <text x="60" y="615">- bin added (new index not in prev) - no sparse ARRIVE action</text>
  </g>

  <!-- Example timeline -->
  <rect x="620" y="485" width="540" height="155" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="640" y="510" font-size="14" font-weight="700" fill="#6b21a8">Example wire sequence</text>
  <g font-size="12" fill="#475569">
    <text x="640" y="535">w1: {0:foo}           -> FULL {0:foo}</text>
    <text x="640" y="555">w2: {0:foo}           -> CARRY</text>
    <text x="640" y="575">w3: {0:bar}           -> SWAP idx=0 payload=bar</text>
    <text x="640" y="595">w4: {0:bar, 3:baz}    -> FULL (new index 3 added)</text>
    <text x="640" y="615">w5: {0:bar}           -> REMOVE idx=3</text>
  </g>

  <!-- Decision flow -->
  <rect x="40" y="660" width="1120" height="135" rx="12" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
  <text x="600" y="690" text-anchor="middle" font-size="16" font-weight="700" fill="#6b21a8">classifySparseChange decision order</text>
  <g font-size="12" fill="#475569">
    <text x="60" y="720">1. prev empty? -> FULL</text>
    <text x="60" y="740">2. curr == prev? -> CARRY</text>
    <text x="60" y="760">3. count -1, single removal, no other edits? -> REMOVE</text>

    <text x="420" y="720">4. same count, exactly one bin value changed? -> SWAP</text>
    <text x="420" y="740">5. else -> FULL</text>
    <text x="420" y="770" font-weight="600" fill="#334155">Viewer replays wires per timestamp; CARRY/SWAP/REMOVE apply to last known map state.</text>
  </g>
</svg>
