<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Automatic Send-to-Pipeline on Time Advance</text>
  <text x="600" y="72" text-anchor="middle" font-size="15" fill="#64748b">Every stage() call runs checkTimeAdvanced_()  the ledger flush trigger</text>

  <!-- Timeline -->
  <line x1="100" y1="130" x2="1100" y2="130" stroke="#94a3b8" stroke-width="3"/>
  <text x="100" y="115" font-size="13" fill="#64748b">sim time �</text>

  <circle cx="200" cy="130" r="8" fill="#2563eb"/>
  <text x="200" y="160" text-anchor="middle" font-size="14" font-weight="600">t=100</text>

  <circle cx="500" cy="130" r="8" fill="#2563eb"/>
  <text x="500" y="160" text-anchor="middle" font-size="14" font-weight="600">t=101</text>

  <circle cx="800" cy="130" r="8" fill="#2563eb"/>
  <text x="800" y="160" text-anchor="middle" font-size="14" font-weight="600">t=102</text>

  <circle cx="1050" cy="130" r="8" fill="#2563eb"/>
  <text x="1050" y="160" text-anchor="middle" font-size="14" font-weight="600">t=103</text>

  <!-- Window 1 -->
  <rect x="140" y="190" width="320" height="120" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="300" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">Window 1  (sim_time=100)</text>
  <text x="300" y="245" text-anchor="middle" font-size="12" fill="#475569">stage() calls accumulate in Ledger</text>
  <text x="300" y="265" text-anchor="middle" font-size="12" fill="#475569">CID A, B, C updates...</text>
  <text x="300" y="290" text-anchor="middle" font-size="11" fill="#64748b">window_id = 1</text>

  <!-- Flush arrow -->
  <path d="M 460 250 L 520 250 L 520 340 L 580 340" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="490" y="235" font-size="12" fill="#dc2626" font-weight="600">time &gt; 100</text>
  <text x="490" y="320" font-size="11" fill="#dc2626">flush</text>

  <!-- Queue -->
  <rect x="580" y="310" width="200" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="680" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">pipeline_head_</text>

  <line x1="780" y1="340" x2="840" y2="340" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="840" y="310" width="200" height="60" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="940" y="338" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">PipelineStager</text>
  <text x="940" y="358" text-anchor="middle" font-size="11" fill="#475569">processes async</text>

  <!-- Window 2 -->
  <rect x="440" y="190" width="320" height="120" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">Window 2  (sim_time=101)</text>
  <text x="600" y="245" text-anchor="middle" font-size="12" fill="#475569">new Ledger created immediately</text>
  <text x="600" y="265" text-anchor="middle" font-size="12" fill="#475569">after flush at t=101</text>
  <text x="600" y="290" text-anchor="middle" font-size="11" fill="#64748b">window_id = 2</text>

  <!-- Decision flowchart -->
  <rect x="80" y="410" width="1040" height="250" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="445" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">checkTimeAdvanced_() logic</text>

  <rect x="120" y="470" width="200" height="55" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="220" y="503" text-anchor="middle" font-size="13">stage() called</text>

  <line x1="320" y1="497" x2="360" y2="497" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="430,470 530,497 430,524" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="480" y="492" text-anchor="middle" font-size="11">first call?</text>
  <text x="480" y="508" text-anchor="middle" font-size="11">create Ledger</text>

  <line x1="530" y1="497" x2="570" y2="497" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="550" y="488" font-size="10" fill="#64748b">no</text>

  <polygon points="640,470 740,497 640,524" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="690" y="492" text-anchor="middle" font-size="11">time == current?</text>
  <text x="690" y="508" text-anchor="middle" font-size="11">keep accumulating</text>

  <line x1="740" y1="497" x2="780" y2="497" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="488" font-size="10" fill="#64748b">no</text>

  <polygon points="850,470 950,497 850,524" fill="#fee2e2" stroke="#ef4444"/>
  <text x="900" y="492" text-anchor="middle" font-size="11">time &gt; current?</text>
  <text x="900" y="508" text-anchor="middle" font-size="11">FLUSH ledger</text>

  <rect x="980" y="470" width="120" height="55" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1040" y="495" text-anchor="middle" font-size="12">new Ledger</text>
  <text x="1040" y="512" text-anchor="middle" font-size="11" fill="#64748b">window_id++</text>

  <line x1="900" y1="524" x2="900" y2="560" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="820" y="560" width="160" height="45" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="900" y="588" text-anchor="middle" font-size="12">pipeline_head_->emplace(ledger)</text>

  <!-- Heartbeat note -->
  <rect x="120" y="560" width="520" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="140" y="585" font-size="13" font-weight="700" fill="#334155">Also triggers encode without new data:</text>
  <text x="140" y="608" font-size="12" fill="#475569">Checkpointer heartbeat (default=10): if a collectable did NOT update this window but</text>
  <text x="140" y="628" font-size="12" fill="#475569">wire_distance e heartbeat OR sim time left the refresh window � re-emit FULL snapshot</text>
</svg>
