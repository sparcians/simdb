<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#334155"/>
    </marker>
    <linearGradient id="simBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="pipeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="dbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">Argos Pipeline: Stager � zlib � Writer</text>
  <text x="600" y="72" text-anchor="middle" font-size="15" fill="#64748b">Three SimDB pipeline stages, each on its own thread (Writer shares the DB thread)</text>

  <!-- Simulation side -->
  <rect x="40" y="110" width="280" height="500" rx="16" fill="url(#simBg)" stroke="#93c5fd" stroke-width="2"/>
  <text x="180" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8">Simulation thread</text>
  <rect x="70" y="175" width="220" height="70" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="180" y="205" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">EntryPoint / Collectables</text>
  <text x="180" y="228" text-anchor="middle" font-size="12" fill="#475569">setScalar / setContig / setSparse</text>

  <rect x="70" y="270" width="220" height="90" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="180" y="300" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">ArgosCollector</text>
  <text x="180" y="322" text-anchor="middle" font-size="12" fill="#475569">implements PipelineStagerInterface</text>
  <text x="180" y="342" text-anchor="middle" font-size="12" fill="#475569">checkTimeAdvanced() � Ledger</text>

  <rect x="70" y="390" width="220" height="70" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="180" y="420" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Ledger (per sim-time window)</text>
  <text x="180" y="443" text-anchor="middle" font-size="12" fill="#475569">scalar / contig / sparse / closed</text>

  <line x1="290" y1="425" x2="360" y2="425" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="325" y="410" text-anchor="middle" font-size="11" fill="#64748b">LedgerPtr</text>

  <!-- Pipeline -->
  <rect x="360" y="110" width="800" height="500" rx="16" fill="url(#pipeBg)" stroke="#86efac" stroke-width="2"/>
  <text x="760" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">argos-collector pipeline</text>

  <!-- Stage 1 -->
  <rect x="400" y="220" width="210" height="150" rx="12" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="505" y="255" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">PipelineStager</text>
  <text x="505" y="280" text-anchor="middle" font-size="12" fill="#475569">main_input_queue � LedgerPtr</text>
  <text x="505" y="300" text-anchor="middle" font-size="12" fill="#475569">createCheckpoint() per CID</text>
  <text x="505" y="320" text-anchor="middle" font-size="12" fill="#475569">encodeForPipeline()</text>
  <text x="505" y="345" text-anchor="middle" font-size="11" fill="#64748b">one Checkpointer per collectable</text>

  <line x1="610" y1="295" x2="660" y2="295" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="635" y="280" text-anchor="middle" font-size="11" fill="#64748b">QueueCollectionData</text>

  <!-- Stage 2 -->
  <rect x="660" y="220" width="210" height="150" rx="12" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="765" y="255" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">Compressor</text>
  <text x="765" y="285" text-anchor="middle" font-size="12" fill="#475569">concatenate CollectedData</text>
  <text x="765" y="305" text-anchor="middle" font-size="12" fill="#475569">compressData()  zlib</text>
  <text x="765" y="330" text-anchor="middle" font-size="11" fill="#64748b">per sim-time batch</text>

  <line x1="870" y1="295" x2="920" y2="295" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="895" y="280" text-anchor="middle" font-size="11" fill="#64748b">CompressedQueueCollectionData</text>

  <!-- Stage 3 -->
  <rect x="920" y="200" width="210" height="190" rx="12" fill="url(#dbBg)" stroke="#fb923c" stroke-width="2"/>
  <text x="1025" y="235" text-anchor="middle" font-size="17" font-weight="700" fill="#9a3412">Writer</text>
  <text x="1025" y="258" text-anchor="middle" font-size="12" fill="#475569">DatabaseStage (DB thread)</text>
  <text x="1025" y="285" text-anchor="middle" font-size="12" fill="#475569">Timestamps table</text>
  <text x="1025" y="305" text-anchor="middle" font-size="12" fill="#475569">CollectionRecords blob</text>
  <text x="1025" y="325" text-anchor="middle" font-size="12" fill="#475569">TimestampClocks</text>
  <text x="1025" y="355" text-anchor="middle" font-size="11" fill="#64748b">+ Notifications side queue</text>

  <!-- SQLite -->
  <rect x="930" y="430" width="190" height="60" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="1025" y="465" text-anchor="middle" font-size="15" font-weight="600" fill="#9a3412">SQLite (.db)</text>
  <line x1="1025" y1="390" x2="1025" y2="430" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="400" y="500" width="720" height="85" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="420" y="528" font-size="13" font-weight="700" fill="#334155">Key idea:</text>
  <text x="420" y="552" font-size="12" fill="#475569">Simulation accumulates raw bytes into a Ledger. When sim time advances, the Ledger is handed off asynchronously.</text>
  <text x="420" y="572" font-size="12" fill="#475569">PipelineStager turns ledger entries into delta-encoded wires, then zlib compresses and Writer persists one blob per timestamp.</text>
</svg>
